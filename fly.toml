# Déploiement sur Fly.io (région Paris). Remplace app par le nom choisi : fly apps create <nom>
app = "montage-video"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations de la base avant chaque mise en ligne.
  release_command = "node dist/lib/db/migrate-cli.js"
  strategy = "rolling"

[processes]
  web = "node_modules/.bin/next start"
  worker = "node dist/worker/index.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  STORAGE_DRIVER = "s3"
  AI_PROVIDER = "anthropic"
  STT_PROVIDER = "deepgram"
  PUBLISH_PROVIDER = "ayrshare"
  EMAIL_PROVIDER = "resend"
  RENDER_CONCURRENCY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  # Le rendu FFmpeg a besoin de CPU et de mémoire.
  processes = ["worker"]
  size = "performance-2x"
  memory = "4gb"
