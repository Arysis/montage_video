# Production sur le VPS : base Postgres, worker (montage, rendu) et site.
# Fichier copié et lancé par deploy/vps/remote-deploy.sh à chaque déploiement. Ne pas lancer à la main
# sans le fichier .env généré par ce script (mot de passe de la base, APP_SECRET, IMAGE).
name: montage-video

x-app: &app
  image: ${IMAGE:?IMAGE manquant}
  restart: unless-stopped
  # Ordre : réglages par défaut, secrets générés sur le serveur, puis variables du secret GitHub APP_ENV.
  env_file:
    - app.base.env
    - .env
    - app.env
  environment:
    DATABASE_URL: postgres://montage:${POSTGRES_PASSWORD}@db:5432/montage
    STORAGE_LOCAL_DIR: /app/.data/storage
    WORK_DIR: /app/.data/work
  volumes:
    - storage:/app/.data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: montage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: montage
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montage -d montage"]
      interval: 5s
      retries: 20

  worker:
    <<: *app
    command: ["sh", "-c", "node dist/lib/db/migrate-cli.js && node dist/worker/index.js"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    # Écoute seulement en local : le reverse proxy du VPS (nginx, Caddy...) sert le site en HTTPS.
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Utilisé seulement si aucun reverse proxy n'occupe déjà les ports 80 et 443 du VPS.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["caddy"]
    environment:
      DOMAIN: ${DOMAIN}
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN}", "--to", "web:3000"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - web

volumes:
  db:
  storage:
  caddy:
