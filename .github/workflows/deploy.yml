name: Déploiement

# Après chaque fusion sur main : image publiée sur GHCR, puis mise en ligne sur le VPS par SSH
# (Docker Compose + reverse proxy HTTPS). Voir « Mise en production » dans le README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Publier l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # GHCR refuse les majuscules (Arysis/montage_video).
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_DEMO_VIDEO_URL=${{ vars.NEXT_PUBLIC_DEMO_VIDEO_URL }}
            NEXT_PUBLIC_DEMO_POSTER_URL=${{ vars.NEXT_PUBLIC_DEMO_POSTER_URL }}
            NEXT_PUBLIC_SHOW_CAPTURES=${{ vars.NEXT_PUBLIC_SHOW_CAPTURES || '0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vps:
    name: Mettre en ligne sur le VPS
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.VPS_DOMAIN || 'montage.estebandimascio.fr' }}
    permissions:
      contents: read
      packages: read
    env:
      # Secret obligatoire : VPS_SSH_KEY (clé privée autorisée sur le VPS).
      # Secret facultatif : APP_ENV (lignes CLE=valeur des vraies clés de prod, voir .env.example).
      # Variables facultatives : VPS_HOST, VPS_USER, VPS_PORT, VPS_DOMAIN, ACME_EMAIL.
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ vars.VPS_HOST || '72.60.95.129' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DOMAIN: ${{ vars.VPS_DOMAIN || 'montage.estebandimascio.fr' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        id: check
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::Secret VPS_SSH_KEY absent : déploiement sur le VPS ignoré."
            echo "Secret \`VPS_SSH_KEY\` absent : déploiement sur le VPS ignoré." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          ssh -o BatchMode=yes -o ConnectTimeout=15 vps 'echo "Connecté à $(hostname)"'

      - name: Déployer
        if: steps.check.outputs.skip != 'true'
        # « shell: bash » active pipefail : un échec du script sur le VPS fait échouer l'étape malgré le « | tee ».
        shell: bash
        env:
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ENV: ${{ secrets.APP_ENV }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          umask 077
          {
            printf 'IMAGE=%q\n' "$IMAGE"
            printf 'DOMAIN=%q\n' "$DOMAIN"
            printf 'WEB_PORT=%q\n' "3100"
            printf 'ACME_EMAIL=%q\n' "$ACME_EMAIL"
            printf 'REGISTRY_USER=%q\n' "$REGISTRY_USER"
            printf 'REGISTRY_TOKEN=%q\n' "$REGISTRY_TOKEN"
            printf 'APP_ENV_B64=%q\n' "$(printf '%s' "$APP_ENV" | tr -d '\r' | base64 -w0)"
          } > deploy/vps/deploy.env
          dir="/tmp/montage-deploy-$GITHUB_RUN_ID"
          tar -C deploy/vps -cz . | ssh vps "umask 077 && mkdir -p $dir && tar -xz -C $dir"
          rm -f deploy/vps/deploy.env
          ssh vps "bash $dir/remote-deploy.sh; s=\$?; rm -rf $dir; exit \$s" | tee deploy.log
          grep '^SUMMARY:' deploy.log | sed 's/^SUMMARY: //' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Vérifier le site en HTTPS
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://$DOMAIN/api/health"; then
              echo "Site en ligne : https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 6
          done
          echo "::warning::https://$DOMAIN ne répond pas encore (DNS ou certificat en attente ?)."
